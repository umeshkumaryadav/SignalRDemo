name: SignalRDemo CI/CD

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:

    # Run GitHub Actions on your LOCAL Windows PC
    runs-on: self-hosted

    steps:

      # 1. Download latest code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Check installed .NET SDK
      - name: Check .NET Version
        shell: powershell
        run: dotnet --version

      # 3. Restore NuGet packages
      - name: Restore
        shell: powershell
        run: dotnet restore .\SignalRDemo.csproj

      # 4. Build application
      - name: Build
        shell: powershell
        run: dotnet build .\SignalRDemo.csproj --configuration Release --no-restore

      # 4.5. Stop IIS Site
      - name: Stop IIS Site
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-Website -Name "SignalRDemo"

      # 5. Publish application
      - name: Publish
        shell: powershell
        run: |
          dotnet publish .\SignalRDemo.csproj `
            --configuration Release `
            --output C:\inetpub\wwwroot\SignalRDemo `
            --no-restore

      # 6. Restart IIS
      - name: Restart IIS
        shell: powershell
        run: iisreset

      # 7. Deployment completed
      - name: Deployment Complete
        shell: powershell
        run: |
          Write-Host "====================================="
          Write-Host "SignalRDemo Deployment Completed"
          Write-Host "IIS Path: C:\inetpub\wwwroot\SignalRDemo"
          Write-Host "====================================="
