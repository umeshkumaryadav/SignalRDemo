name: SignalRDemo CI/CD

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:

    runs-on: self-hosted

    env:
      DEPLOY_PATH: 'C:\inetpub\wwwroot\SignalRDemo'
      PUBLISH_PATH: '${{ runner.temp }}\SignalRDemoPublish'

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check .NET SDK
        shell: powershell
        run: |
          Write-Host "Installed .NET version:"
          dotnet --version

          Write-Host ""
          Write-Host ".NET information:"
          dotnet --info

      - name: Restore
        run: dotnet restore SignalRDemo/SignalRDemo.csproj

      - name: Publish
        run: |
          dotnet publish SignalRDemo/SignalRDemo.csproj `
            --configuration Release `
            --output "${{ env.PUBLISH_PATH }}" `
            --no-restore

      - name: Stop IIS
        shell: powershell
        run: |
          Import-Module WebAdministration

          Write-Host "Stopping SignalRDemo IIS website..."

          if (Get-Website -Name "SignalRDemo" -ErrorAction SilentlyContinue) {
              Stop-Website -Name "SignalRDemo"
          }

      - name: Deploy to IIS
        shell: powershell
        run: |
          $source = "${{ env.PUBLISH_PATH }}"
          $destination = "${{ env.DEPLOY_PATH }}"

          Write-Host "Source      : $source"
          Write-Host "Destination : $destination"

          if (!(Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force | Out-Null
          }

          robocopy $source $destination /MIR /R:2 /W:2

          $exitCode = $LASTEXITCODE

          Write-Host "Robocopy exit code: $exitCode"

          if ($exitCode -le 7) {
              exit 0
          }

          exit $exitCode

      - name: Start IIS
        if: success()
        shell: powershell
        run: |
          Import-Module WebAdministration

          Write-Host "Starting SignalRDemo IIS website..."

          Start-Website -Name "SignalRDemo"

      - name: Verify IIS
        if: success()
        shell: powershell
        run: |
          Import-Module WebAdministration

          $site = Get-Website -Name "SignalRDemo"

          Write-Host "Site  : $($site.Name)"
          Write-Host "State : $($site.State)"

          if ($site.State -ne "Started") {
              throw "SignalRDemo IIS website is not running."
          }

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Remove-Item `
            "${{ env.PUBLISH_PATH }}" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue